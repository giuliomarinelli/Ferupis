name: One-shot restored media sync

on:
  push:
    branches:
      - feat/media-upscaling-pipeline
    paths:
      - .github/workflows/sync-restored-media-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/media-upscaling-pipeline

      - name: Synchronize restored media and picsMap
        run: node scripts/ts/src/sync-restored-pics.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit synchronized media
        shell: bash
        run: |
          git add -- apps/ferupis-qwik/src/media/pics/index.ts apps/ferupis-qwik/src/media/pics/restored
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: complete restored media map"
          git push origin HEAD:feat/media-upscaling-pipeline
