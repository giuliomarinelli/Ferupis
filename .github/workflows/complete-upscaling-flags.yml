name: Complete upscaling flags

on:
  push:
    branches:
      - chore/upscaling-flags

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply flags
        run: node scripts/ts/src/complete-upscaling-flags.mjs

      - name: Commit generated mapping
        shell: bash
        run: |
          if git diff --quiet -- apps/ferupis-qwik/src/media/pics/index.ts; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/ferupis-qwik/src/media/pics/index.ts
          git commit -m "chore: classify image upscaling flags"
          git push
