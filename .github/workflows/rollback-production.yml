name: Roll back production

on:
  workflow_dispatch:
    inputs:
      pages_deployment_id:
        description: Successful production Pages deployment ID to restore
        required: true
        type: string
      reason:
        description: Incident or rollback reason
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK_PRODUCTION
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore known-good Pages deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ferupis.pages.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ferupis
      PAGES_PUBLIC_URL: https://ferupis.pages.dev
      ROLLBACK_DEPLOYMENT_ID: ${{ inputs.pages_deployment_id }}
      ROLLBACK_REASON: ${{ inputs.reason }}
    steps:
      - name: Validate explicit confirmation and deployment ID
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "ROLLBACK_PRODUCTION"
          [[ "$ROLLBACK_DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Roll back Pages production
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/deployments/$ROLLBACK_DEPLOYMENT_ID/rollback" \
            > rollback-response.json
          jq -e '.success == true' rollback-response.json > /dev/null

      - name: Verify production after rollback
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --silent --show-error --fail --location "$PAGES_PUBLIC_URL/" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Record rollback summary
        shell: bash
        run: |
          {
            echo "# Production rollback"
            echo
            echo "- Pages deployment: \`$ROLLBACK_DEPLOYMENT_ID\`"
            echo "- Reason: $ROLLBACK_REASON"
            echo "- Production URL: $PAGES_PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"
