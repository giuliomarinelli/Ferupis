name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Typecheck workspaces
        run: npm run build.types --workspaces --if-present

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build Ferupis Pages artifact
        run: npm run build:f

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f apps/ferupis-qwik/dist/index.html
          test -f apps/ferupis-qwik/dist/_worker.js
          test -f apps/ferupis-qwik/dist/_routes.json
          test -f apps/ferupis-qwik/dist/sitemap.xml

      - name: Validate workflow formatting
        run: npx prettier --check ".github/workflows/*.yml"

      - name: Upload tested Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferupis-pages-${{ github.sha }}
          path: apps/ferupis-qwik/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
